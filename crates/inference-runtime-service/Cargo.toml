[package]
name = "inference-runtime-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inference-runtime-launcher = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
async-channel = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossbeam-channel = { workspace = true }
delegate = { workspace = true }
futures-util = { workspace = true }
hf-chat-template = { workspace = true }
hound = { workspace = true }
inference-executor-core = { path = "../inference-executor-core" }
inference-executor-metal = { workspace = true }
inference-runtime-core = { path = "../inference-runtime-core" }
inference-runtime-proto = { path = "../inference-runtime-proto" }
mimalloc = { workspace = true }
ordered-float = { workspace = true }
reqwest = { workspace = true }
rubato = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-stream = { workspace = true }
tokenizers = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
tracing = { workspace = true }
