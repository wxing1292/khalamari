syntax = "proto3";

package khalamari.inference.v1;

service InferenceRuntime {
  rpc TranscribeAudio(AudioTranscribeReq) returns (AudioTranscribeResp);
  rpc StreamAudio(stream AudioStreamReq) returns (stream AudioStreamResp);
  rpc GenerateTokens(GenerateTokensRequest) returns (stream GenerateTokensResponse);
  rpc GenerateTokensStream(stream GenerateTokensRequest) returns (stream GenerateTokensResponse);
  rpc GenerateMessages(GenerateMessagesRequest) returns (stream GenerateMessagesResponse);
  rpc GenerateMessagesStream(stream GenerateMessagesRequest) returns (stream GenerateMessagesResponse);
}

// One independent WAV snapshot. Continuous recording and revisions belong to the client.
message AudioTranscribeReq {
  bytes wav = 1;
  string model = 2;
  optional string language = 3;
  optional string context = 4;
}

message AudioTranscribeResp {
  string text = 1;
  string language = 2;
}

// One connection owns a bounded cache of mono 16 kHz signed i16 little-endian PCM.
// Append ranges are ordered and disjoint. Sample positions include omitted silence.
message AudioStreamReq {
  oneof command {
    AudioAppend append = 1;
    AudioRangeTranscribe transcribe = 2;
    uint64 release_before_sample = 3;
    uint64 cancel_request_id = 4;
    AudioFinish finish = 5;
  }
}

// Seal input and drain accepted requests before returning final connection statistics.
message AudioFinish {}

message AudioAppend {
  uint64 start_sample = 1;
  bytes pcm_s16le = 2;
}

message AudioRangeTranscribe {
  uint64 request_id = 1;
  uint64 start_sample = 2;
  uint64 end_sample = 3;
  string model = 4;
  optional string language = 5;
  optional string context = 6;
}

message AudioStreamStats {
  uint64 uploaded_samples = 1;
  uint64 requested_samples = 2;
  uint64 peak_buffered_samples = 3;
  uint64 buffered_samples = 4;
}

message AudioStreamError {
  // Canonical gRPC status code, shared by both streaming transports.
  int32 code = 1;
  string message = 2;
}

message AudioStreamResp {
  // Zero acknowledges an append; other IDs correlate transcription responses.
  uint64 request_id = 1;
  oneof result {
    AudioTranscribeResp transcription = 2;
    AudioStreamError error = 3;
  }
  // Cumulative work accepted by this connection, including cancelled jobs.
  AudioStreamStats stats = 4;
  bool finished = 5;
}

message GenerateTokensRequest {
  repeated uint32 tokens = 1;
  GenerationConfig generation = 2;
}

message GenerationConfig {
  uint32 max_sampled_tokens = 1;
  repeated TokenSequence stop_sequences = 2;
  optional float temperature = 3;
  optional uint32 top_k = 4;
  optional float top_p = 5;
  optional uint32 seed = 6;
}

message TokenSequence {
  repeated uint32 tokens = 1;
}

message GenerateTokensResponse {
  uint64 request_id = 1;
  oneof event {
    TokenChunk chunk = 2;
    GenerationCompletion completion = 3;
  }
}

message TokenChunk {
  repeated uint32 tokens = 1;
  repeated float probs = 2;
}

message GenerateMessagesRequest {
  repeated InputMessage messages = 1;
  ToolDelta tools = 2;
  GenerationConfig generation = 3;
  bool enable_thinking = 4;
  optional ReasoningEffort reasoning_effort = 5;
}

enum ReasoningEffort {
  REASONING_EFFORT_UNSPECIFIED = 0;
  REASONING_EFFORT_LOW = 1;
  REASONING_EFFORT_MEDIUM = 2;
  REASONING_EFFORT_HIGH = 3;
  REASONING_EFFORT_XHIGH = 4;
}

message InputMessage {
  oneof message {
    TextMessage system = 1;
    TextMessage user = 2;
    AssistantMessage assistant = 3;
    ToolResultMessage tool_result = 4;
  }
}

message TextMessage {
  string text = 1;
}

message AssistantMessage {
  repeated MessageContent content = 1;
  repeated ToolCall tool_calls = 2;
}

message MessageContent {
  oneof content {
    string text = 1;
    string reasoning = 2;
  }
}

message ToolCall {
  string id = 1;
  string tool_id = 2;
  string arguments_json = 3;
}

message ToolResultMessage {
  string tool_call_id = 1;
  string tool_id = 2;
  repeated string text = 3;
  bool is_error = 4;
}

message ToolDelta {
  repeated ToolDefinition insert = 1;
  repeated string remove = 2;
}

message ToolDefinition {
  string id = 1;
  optional string description = 2;
  string input_schema_json = 3;
}

message GenerateMessagesResponse {
  uint64 request_id = 1;
  oneof event {
    TextChunk reasoning = 2;
    TextChunk text = 3;
    ToolCall tool_call = 4;
    GenerationCompletion completion = 5;
  }
}

message TextChunk {
  string text = 1;
}

message GenerationCompletion {
  CompletionReason reason = 1;
  uint64 num_input_tokens = 2;
  uint64 num_output_tokens = 3;
}

enum CompletionReason {
  COMPLETION_REASON_UNSPECIFIED = 0;
  COMPLETION_REASON_STOP_SEQUENCE = 1;
  COMPLETION_REASON_LENGTH_LIMIT = 2;
  COMPLETION_REASON_CONTEXT_LIMIT = 3;
}
