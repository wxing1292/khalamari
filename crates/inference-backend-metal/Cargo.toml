[package]
name = "inference-backend-metal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
block2 = { workspace = true }
half = { workspace = true }
libc = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true, features = [
  "MTL4CommandAllocator",
  "MTL4CommandBuffer",
  "MTL4CommandEncoder",
  "MTL4CommandQueue",
  "MTL4CommitFeedback",
  "MTL4ComputeCommandEncoder",
  "MTL4Counters",
  "MTLResidencySet",
  "MTLGPUAddress",
  "MTLIOCommandBuffer",
  "MTLIOCommandQueue",
  "block2",
] }

[dev-dependencies]
criterion = { workspace = true }
inference-executor-core = { path = "../inference-executor-core" }

[[bench]]
name = "moe"
path = "benches/mlp/moe.rs"
harness = false

