[workspace]
resolver = "2"
members = [
  "crates/inference-asr-client",
  "crates/inference-backend-metal",
  "crates/inference-error",
  "crates/inference-executor-core",
  "crates/inference-executor-metal",
  "crates/inference-runtime-core",
  "crates/inference-runtime-launcher",
  "crates/inference-runtime-macro",
  "crates/inference-runtime-proto",
  "crates/inference-runtime-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wenquan Xing"]
license = "MIT"
repository = "https://github.com/wxing1292/psi-dec"

[workspace.dependencies]
ahash = "0.8"
async-channel = "2.5"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1.12"
block2 = "0.6"
clap = "4.6"
comfy-table = "8.0"
criterion = "0.8"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
ct2rs = { version = "0.10", default-features = false }
dashmap = "6.2"
delegate = "0.13"
dyn-clone = "1.0"
event-listener = "5.4"
futures-lite = "2.6"
futures-util = "0.3"
half = "2.7"
hdrhistogram = "7.6"
hf-chat-template = "1.0"
hound = "3.5"
inference-backend-metal = { path = "crates/inference-backend-metal" }
inference-error = { path = "crates/inference-error" }
inference-executor-core = { path = "crates/inference-executor-core" }
inference-executor-metal = { path = "crates/inference-executor-metal" }
inference-runtime-launcher = { path = "crates/inference-runtime-launcher" }
intrusive-collections = "0.10"
itertools = "0.15"
libc = "0.2"
map-macro = "0.3"
mimalloc = "0.1"
mockall = "0.15"
nix = "0.31"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", default-features = false, features = [
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLIndirectCommandBuffer",
  "MTLIndirectCommandEncoder",
  "MTLLibrary",
  "MTLEvent",
  "MTLResource",
  "MTLTypes",
] }
offset-allocator = "0.2"
ordered-float = "5.5"
ort = { version = "=2.0.0-rc.15", default-features = false }
prost = "0.14"
quick_cache = { version = "0.7", default-features = false, features = [
  "custom-hasher",
] }
quote = "1.0"
rand = "0.10"
rayon = "1.12"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
rubato = "5.0"
rustfft = "6.4"
safetensors = "0.8"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
slotmap = "1.1"
smallvec = "1.16"
syn = "3.0"
tempfile = "3.27"
thiserror = "2.0"
tokenizers = "0.23"
tokio = "1.54"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "1.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
unicode-width = "0.2"
uuid = { version = "1.29", features = ["v4"] }
wincode = { version = "0.6", features = ["derive"] }
zerocopy = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
